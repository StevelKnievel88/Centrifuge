name: Build Centrifuge

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  ORT_VERSION: "1.22.0"
  DML_VERSION: "1.15.4"

jobs:
  # ---------------------------------------------------------------------------
  # Export the HTDemucs stem model to ONNX (cached: only runs when the script changes)
  # ---------------------------------------------------------------------------
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache model
        id: cache
        uses: actions/cache@v4
        with:
          path: model
          key: htdemucs-onnx-${{ hashFiles('tools/export_htdemucs_onnx.py') }}-v1

      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.11"

      - name: Export model
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          tools/run_logged.sh pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          tools/run_logged.sh pip install "numpy<2" einops julius omegaconf pyyaml tqdm lameenc onnx==1.17.0 onnxruntime==1.20.1 soundfile
          tools/run_logged.sh pip install --no-deps openunmix==1.3.0
          git clone https://github.com/sevagh/demucs.onnx demucs-onnx
          git -C demucs-onnx checkout 81fa192e6fcc88e35e887f6e6ccce91227f4e6f5
          mkdir -p model
          PYTHONPATH=$PWD/tools/stubs tools/run_logged.sh python tools/export_htdemucs_onnx.py demucs-onnx/demucs-for-onnx model/htdemucs.onnx
          ls -la model

      - uses: actions/upload-artifact@v4
        continue-on-error: true   # (the artifact quota can be full; the Windows job then fetches the model from a release)
        with:
          name: htdemucs-model
          path: model/htdemucs.onnx
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Models for the High / Best stem qualities (cached; published once on the "models" release)
  #   htdemucs_ft: the fine-tuned specialist models for drums, bass and vocals, exported like htdemucs
  #   Mel-Band RoFormer vocals (Kimberley Jensen, MIT), ONNX conversion by smank (MIT), pinned and checksummed
  # ---------------------------------------------------------------------------
  extra-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache models
        id: cache
        uses: actions/cache@v4
        with:
          path: extra
          key: extra-models-${{ hashFiles('tools/export_htdemucs_onnx.py') }}-v1

      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.11"

      - name: Export htdemucs_ft and fetch the RoFormer
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          tools/run_logged.sh pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          tools/run_logged.sh pip install "numpy<2" einops julius omegaconf pyyaml tqdm lameenc onnx==1.17.0 onnxruntime==1.20.1 soundfile
          tools/run_logged.sh pip install --no-deps openunmix==1.3.0
          git clone https://github.com/sevagh/demucs.onnx demucs-onnx
          git -C demucs-onnx checkout 81fa192e6fcc88e35e887f6e6ccce91227f4e6f5
          mkdir -p extra
          for pair in "drums 0" "bass 1" "vocals 3"; do
            set -- $pair
            PYTHONPATH=$PWD/tools/stubs tools/run_logged.sh python tools/export_htdemucs_onnx.py demucs-onnx/demucs-for-onnx extra/htdemucs_ft_$1.onnx htdemucs_ft $2
          done
          curl -sSfL -o extra/melband_roformer_vocals.onnx https://huggingface.co/smank/mel-band-roformer-vocals-onnx/resolve/60cb6b4b97e41b42f7ff16c2e386f47a8cc7e50a/melband_roformer_vocals.onnx
          echo "64a4f3bee48fbe7d971b23875adc924ed004c3533f49672592641dddc0f6f561  extra/melband_roformer_vocals.onnx" | sha256sum -c
          ls -la extra

  # ---------------------------------------------------------------------------
  # Check the C++ stem pipeline against the official demucs on Linux
  # ---------------------------------------------------------------------------
  validate-stems:
    needs: [model, extra-models]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: htdemucs-model
          path: model
      - uses: actions/cache/restore@v4
        with:
          path: extra
          key: extra-models-${{ hashFiles('tools/export_htdemucs_onnx.py') }}-v1
          fail-on-cache-miss: true

      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libfreetype-dev libfontconfig1-dev libasound2-dev libgl1-mesa-dev ninja-build xvfb
          curl -sSL -o ort.tgz https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz
          tar xzf ort.tgz && mv onnxruntime-linux-x64-${ORT_VERSION} ort

      - name: Build (Linux)
        run: |
          tools/run_logged.sh cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DORT_ROOT=$PWD/ort
          tools/run_logged.sh cmake --build build --parallel

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compare with official demucs
        run: |
          tools/run_logged.sh pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          tools/run_logged.sh pip install "numpy<2" einops julius omegaconf pyyaml tqdm lameenc soundfile
          tools/run_logged.sh pip install --no-deps openunmix==1.3.0 demucs==4.0.1
          export PYTHONPATH=$PWD/tools/stubs
          python tools/stem_reference.py make-test test.wav
          tools/run_logged.sh python tools/stem_reference.py separate test.wav ref
          export LD_LIBRARY_PATH=$PWD/ort/lib
          tools/run_logged.sh xvfb-run -a ./build/Centrifuge_artefacts/Release/Centrifuge --separate test.wav --out orbit --model model/htdemucs.onnx --cpu
          tools/run_logged.sh python tools/stem_reference.py compare ref orbit

      # Better / High: High must match the official htdemucs_ft; Better must run and add up.
      # (Best's RoFormer needs more memory than the CI runners have, so it's only used with a graphics card.)
      - name: Higher stem qualities
        run: |
          export PYTHONPATH=$PWD/tools/stubs LD_LIBRARY_PATH=$PWD/ort/lib
          cp extra/*.onnx model/
          tools/run_logged.sh python tools/stem_reference.py separate test.wav ref_ft htdemucs_ft
          for q in better high; do
            tools/run_logged.sh xvfb-run -a ./build/Centrifuge_artefacts/Release/Centrifuge --separate test.wav --out orbit_$q --model model/htdemucs.onnx --cpu --quality $q
            tools/run_logged.sh python tools/stem_reference.py sanity test.wav orbit_$q
          done
          tools/run_logged.sh python tools/stem_reference.py compare ref_ft orbit_high

      # The USB export must read back in Centrifuge and in two independent rekordbox readers
      - name: Check USB and rekordbox XML export
        run: |
          git clone --depth 1 https://github.com/Holzhaus/rekordcrate.git rekordcrate
          git clone --depth 1 https://github.com/dylanljones/pyrekordbox.git pyrekordbox-src
          cp -r rekordcrate/data/complete_export/demo_tracks testusb
          export LD_LIBRARY_PATH=$PWD/ort/lib
          tools/run_logged.sh xvfb-run -a ./build/Centrifuge_artefacts/Release/Centrifuge --export-test testusb --fake-audio --add-music --out exported
          tools/run_logged.sh pip install construct bidict psutil
          PYREKORDBOX_SRC=$PWD/pyrekordbox-src tools/run_logged.sh python tools/check_export.py exported
          cd rekordcrate
          tools_log=../tools/run_logged.sh
          $tools_log cargo build --release --features cli
          $tools_log ./target/release/rekordcrate dump-pdb ../exported/stick/PIONEER/rekordbox/export.pdb > ../pdb.txt
          grep -q "Demo Track 1" ../pdb.txt || (echo "::error::rekordcrate didn't find the exported tracks" && exit 1)
          $tools_log ./target/release/rekordcrate list-playlists ../exported/stick/PIONEER/rekordbox/export.pdb
          for f in ../exported/stick/PIONEER/USBANLZ/*/*/ANLZ0000.*; do
            if ! ./target/release/rekordcrate dump-anlz "$f" > /dev/null 2> anlz-err.txt; then
              echo "::error title=rekordcrate dump-anlz::$(basename $(dirname $f))/$(basename $f): $(tail -8 anlz-err.txt | tr '\n' ' ')"
              exit 1
            fi
          done
          echo "rekordcrate read the exported database and analysis files"

  # ---------------------------------------------------------------------------
  # Windows build (the app you run)
  # ---------------------------------------------------------------------------
  windows:
    needs: model
    if: always()
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: htdemucs-model
          path: model

      - name: Stem model (from the releases when the artifact isn't there)
        if: hashFiles('model/htdemucs.onnx') == ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force model | Out-Null
          gh release download models -p htdemucs.onnx -D model 2>$null
          if (-not (Test-Path model/htdemucs.onnx)) {
            gh release download latest -p "Centrifuge-*-Windows.zip" -D prev
            $z = Get-ChildItem prev/*.zip -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($z) {
              Expand-Archive $z.FullName prevx
              $m = Get-ChildItem -Recurse prevx -Filter htdemucs.onnx | Select-Object -First 1
              if ($m) {
                Copy-Item $m.FullName model/
                gh release upload models model/htdemucs.onnx --clobber
              }
            }
          }
          Get-ChildItem model

      - name: ASIO SDK
        shell: pwsh
        run: |
          $urls = @("https://www.steinberg.net/asiosdk", "https://download.steinberg.net/sdk_downloads/asiosdk_2.3.3_2019-06-14.zip")
          foreach ($u in $urls) {
            try {
              Invoke-WebRequest -Uri $u -OutFile asiosdk.zip -MaximumRedirection 10 -UseBasicParsing
              Expand-Archive asiosdk.zip -DestinationPath asiosdk -Force
              if (Get-ChildItem -Recurse -Filter iasiodrv.h -Path asiosdk) { break }
            } catch { Write-Host "ASIO SDK not available from $u" }
          }
          $h = Get-ChildItem -Recurse -Filter iasiodrv.h -Path asiosdk -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($h) { "ASIO_DIR=$($h.Directory.Parent.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append; Write-Host "ASIO SDK: $($h.Directory.Parent.FullName)" }
          else { Write-Host "::warning::ASIO SDK unavailable - building with WASAPI only" }

      - name: ONNX Runtime + DirectML
        shell: pwsh
        run: |
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.ML.OnnxRuntime.DirectML/$env:ORT_VERSION" -OutFile ort.zip
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.AI.DirectML/$env:DML_VERSION" -OutFile dml.zip
          Expand-Archive ort.zip ort-pkg
          Expand-Archive dml.zip dml-pkg
          New-Item -ItemType Directory -Force ort/include, ort/lib, ort/bin | Out-Null
          Copy-Item ort-pkg/build/native/include/* ort/include -Recurse
          Copy-Item ort-pkg/runtimes/win-x64/native/onnxruntime.lib ort/lib
          Copy-Item ort-pkg/runtimes/win-x64/native/*.dll ort/bin
          Copy-Item (Get-ChildItem -Recurse dml-pkg -Filter DirectML.dll | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1).FullName ort/bin
          Get-ChildItem -Recurse ort | Select-Object FullName

      - name: Configure
        shell: bash
        run: tools/run_logged.sh cmake -S . -B build -A x64 -DORT_ROOT="$(pwd -W)/ort" -DASIO_SDK_DIR="$ASIO_DIR"

      - name: Build
        shell: bash
        run: tools/run_logged.sh cmake --build build --config Release --parallel -- -v:minimal -clp:ErrorsOnly

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: XZ tools
        shell: pwsh
        run: |
          python -m pip install --quiet pyinstaller==6.11.1 cryptography pycdlib inflate64
          python -m PyInstaller --onefile --console --name "Centrifuge XZ Tools" --distpath xztools --workpath xzbuild --specpath xzbuild --add-data "${{ github.workspace }}\tools\xz\bin\cfxz-peek;bin" --add-data "${{ github.workspace }}\tools\xz\bin\centrifuge-splash.rgb565;bin" --add-data "${{ github.workspace }}\tools\xz\bin\cfxz-screen;bin" --add-data "${{ github.workspace }}\tools\xz\bin\centrifuge-screen.rgb565;bin" tools/xz/centrifuge_xz.py

      - name: Package
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse build -Filter Centrifuge.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force "Centrifuge/XZ" | Out-Null
          Copy-Item "xztools/Centrifuge XZ Tools.exe" "Centrifuge/XZ/"
          Copy-Item tools/xz/README.txt "Centrifuge/XZ/"
          New-Item -ItemType Directory -Force Centrifuge/models | Out-Null
          Copy-Item $exe.FullName Centrifuge/
          Copy-Item ort/bin/*.dll Centrifuge/
          if (Test-Path model/htdemucs.onnx) { Copy-Item model/htdemucs.onnx Centrifuge/models/ } else { Write-Host "::warning::stem model missing from this build" }
          Copy-Item docs/README-Windows.txt Centrifuge/README.txt
          Copy-Item resources/fonts/LICENSE-Inter.txt Centrifuge/
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(Centrifuge VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $zip = "Centrifuge-$ver-Windows.zip"
          Compress-Archive -Path Centrifuge -DestinationPath $zip -CompressionLevel Optimal
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-Item $zip

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Centrifuge-Windows
          path: Centrifuge
          retention-days: 30

      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest $env:ZIP_NAME --prerelease --title "Centrifuge (latest build)" --notes "Built from $env:GITHUB_SHA. Download $env:ZIP_NAME, extract it, and run Centrifuge.exe. Models for the High / Best stem qualities: see the 'models' release."

  # ---------------------------------------------------------------------------
  # The High / Best models as zips on the "models" release (uploaded once; they rarely change)
  # ---------------------------------------------------------------------------
  publish-models:
    if: github.ref == 'refs/heads/main'
    needs: [extra-models, validate-stems]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the models release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=$(gh release view models --json assets -q '.assets[].name' 2>/dev/null || true)
          if echo "$assets" | grep -q "Centrifuge-Models-FineTuned.zip" && echo "$assets" | grep -q "Centrifuge-Models-RoFormer.zip"; then
            echo "publish=false" >> $GITHUB_OUTPUT
          else
            echo "publish=true" >> $GITHUB_OUTPUT
          fi
      - uses: actions/cache/restore@v4
        if: steps.check.outputs.publish == 'true'
        with:
          path: extra
          key: extra-models-${{ hashFiles('tools/export_htdemucs_onnx.py') }}-v1
          fail-on-cache-miss: true
      - name: Publish
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ft/models ro/models
          cp extra/htdemucs_ft_*.onnx ft/models/
          cp extra/melband_roformer_vocals.onnx ro/models/
          cat > ro/models/RoFormer-LICENSE.txt <<'TXT'
          Mel-Band RoFormer vocals model: weights (c) Kimberley Jensen, MIT licence
          (https://huggingface.co/KimberleyJSN/melbandroformer). ONNX conversion (c) smank, MIT
          (https://huggingface.co/smank/mel-band-roformer-vocals-onnx), building on ZFTurbo's
          Music-Source-Separation-Training and lucidrains' BS-RoFormer implementation (MIT).
          TXT
          (cd ft && zip -r -1 ../Centrifuge-Models-FineTuned.zip models)
          (cd ro && zip -r -0 ../Centrifuge-Models-RoFormer.zip models)
          gh release view models > /dev/null 2>&1 || gh release create models --title "Stem models for High / Best quality" --notes "Extract into the Centrifuge folder (next to Centrifuge.exe) so the files land in its models folder. High needs Centrifuge-Models-FineTuned.zip; Best needs both zips."
          gh release upload models Centrifuge-Models-FineTuned.zip Centrifuge-Models-RoFormer.zip --clobber
